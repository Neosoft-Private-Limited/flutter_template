name: Release

# Builds signed release artifacts. Manual only: nothing is built, signed or
# published as a side effect of merging.
#
# Setup (see docs/environment-configuration.md#release-signing):
# 1. Create GitHub environments "staging" and "production"; protect
#    "production" with required reviewers.
# 2. Add the Android signing secrets to each environment.
# 3. Set the real API URL in apps/app/config/prod.json. The prod build refuses
#    to start with a placeholder host.
#
# This workflow uploads artifacts to the run; it does not publish to stores.
# Add store upload (Play Console, App Store Connect) once you have accounts,
# service credentials and a review process.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to build
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  android:
    name: Android App Bundle (${{ inputs.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.flavor == 'prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Quality gate
        run: dart run melos run validate

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set for this environment."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build app bundle
        working-directory: apps/app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release
          --flavor ${{ inputs.flavor }}
          --dart-define-from-file=config/${{ inputs.flavor }}.json
          --obfuscate --split-debug-info=build/debug-info

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ inputs.flavor }}-${{ github.run_number }}
          path: |
            apps/app/build/app/outputs/bundle/${{ inputs.flavor }}Release/*.aab
            apps/app/build/debug-info/
          if-no-files-found: error
          retention-days: 14

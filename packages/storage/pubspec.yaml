name: storage
description: Local persistence for the workspace - typed key-value preferences, secure storage for secrets, and schema migrations.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  core: any
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  logging: ^1.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1
